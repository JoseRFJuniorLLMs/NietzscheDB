# Portable defaults for CI, release artifacts, and Docker images.
#
# CPU-specific tuning must be opt-in so binaries compiled on one host do not
# accidentally require instruction sets unavailable on another host.
# For local maximum-performance benchmarks use:
#
#   RUSTFLAGS="-C target-cpu=native" cargo build --profile perf
#
# Keep clang as the Linux linker because the release profile uses LTO.

[target.x86_64-unknown-linux-gnu]
linker = "clang"
