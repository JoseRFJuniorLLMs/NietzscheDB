name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── fmt + clippy ──────────────────────────────────────────────────────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release metadata
        run: python3 scripts/check_release_version.py

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: rustfmt changed Rust files
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          mapfile -t rust_files < <(git diff --name-only "origin/$BASE_REF...HEAD" -- '*.rs')
          if (( ${#rust_files[@]} == 0 )); then
            echo "No Rust source files changed."
          else
            rustfmt --edition 2021 --check "${rust_files[@]}"
          fi

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  # ── tests ─────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev clang

      - name: cargo test --workspace
        run: cargo test --workspace --no-default-features

  # ── benchmark dry-run (compile only) ─────────────────────────────────────
  bench-dry-run:
    name: Benchmark compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev clang

      - name: cargo bench --no-run
        run: cargo bench --workspace --no-run --no-default-features

  # ── docker build ──────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nietzschedb/server:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  notify:
    name: Email Notification
    runs-on: ubuntu-latest
    needs: [lint, test, bench-dry-run, docker]
    if: always()
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ contains(needs.*.result, 'failure') && '❌' || '✅' }} ${{ github.workflow }} - ${{ github.ref_name }}"
          to: petweofc@gmail.com,web2ajax@gmail.com
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Workflow: ${{ github.workflow }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
